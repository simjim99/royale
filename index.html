V.profile=()=>{const ks=[...Object.keys(GN)],T=ks.reduce((a,k)=>{const s=D.stats[k]||{n:0,w:0,p:0};a.n+=s.n;a.w+=s.w;a.p+=s.p;return a},{n:0,w:0,p:0}),ago=t=>{const s=(Date.now()-t)/1e3|0;return s<60?s+'s ago':s<3600?(s/60|0)+'m ago':s<86400?(s/3600|0)+'h ago':(s/86400|0)+'d ago'},sg=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n)),cl=n=>n>0?'pos':n<0?'neg':'';
main.innerHTML=`<h2 class="pg">Your Profile</h2><div class="cards2"><div class="panel"><h4>BALANCE</h4><b>${fmt(D.bal)}</b></div><div class="panel"><h4>ROUNDS PLAYED</h4><b>${T.n}</b></div><div class="panel"><h4>TOTAL WAGERED</h4><b>${fmt(T.w)}</b></div><div class="panel"><h4>NET RESULT</h4><b class="${cl(T.p-T.w)}">${sg(T.p-T.w)}</b></div></div>
<div class="panel" style="overflow-x:auto"><table class="tb"><tr><th>GAME</th><th>ROUNDS</th><th>WAGERED</th><th>RETURNED</th><th>NET</th><th>BEST WIN</th><th>WIN %</th></tr>${ks.map(k=>{const s=D.stats[k]||{n:0,w:0,p:0,best:0,wins:0};return`<tr><td>${GN[k]}</td><td>${s.n}</td><td>${fmt(s.w)}</td><td>${fmt(s.p)}</td><td class="${cl(s.p-s.w)}">${sg(s.p-s.w)}</td><td>${fmt(s.best)}</td><td>${s.n?Math.round(s.wins/s.n*100):0}%</td></tr>`}).join('')}</table></div>
<div class="panel" style="margin-top:16px"><h4 style="text-align:left;margin-bottom:8px">PREVIOUS RESULTS</h4>${D.hist.length?D.hist.slice(0,30).map(h=>`<div class="hl"><span><b>${GN[h.g]}</b> <small>${h.d}</small></span><span><span class="${cl(h.p-h.w)}">${sg(h.p-h.w)}</span> <small>${ago(h.t)}</small></span></div>`).join(''):'<p style="color:var(--m);padding:10px 0">No rounds played yet.</p>'}</div>
<div class="acts"><button class="btn g" id="rst">Reset balance &amp; stats</button></div>`;$('#rst').onclick=()=>{if(confirm('Reset your balance and all stats?')){D=JSON.parse(JSON.stringify(DEF));setBal(D.bal);go('profile')}}};
V.settings=()=>{const L=[['card','Card dealing speed'],['chip','Chip throw speed'],['roulette','Roulette spin speed'],['slot','Slot reel speed'],['crash','Crash rocket speed']];
main.innerHTML=`<h2 class="pg">Settings</h2><div class="panel">${L.map(([k,n])=>`<div class="srow"><label>${n}</label><input type="range" data-k="${k}" min=".5" max="3" step=".25" value="${D.set[k]}"><output>${D.set[k].toFixed(2)}×</output></div>`).join('')}<div class="srow"><label>Win celebration (chip spray &amp; “You Won!”)</label><button class="btn g" id="fxb">${D.set.fx?'On':'Off'}</button></div><div class="acts"><button class="btn g" id="sd">Restore defaults</button></div></div>`;
$$('.srow input').forEach(i=>i.oninput=()=>{D.set[i.dataset.k]=+i.value;i.nextElementSibling.textContent=(+i.value).toFixed(2)+'×';save()});$('#fxb').onclick=()=>{D.set.fx=D.set.fx?0:1;save();$('#fxb').textContent=D.set.fx?'On':'Off'};$('#sd').onclick=()=>{D.set={...DEF.set};save();go('settings')}};
/* ---------- FREE CHIPS ---------- */
$('#free').onclick=()=>{const m=$('#modal');m.innerHTML=`<div class="mbox"><div class="mhd"><h2>Free Chips</h2><button class="ib" id="mx">✕</button></div><small style="color:var(--m)">Win chips on the house. Play as often as you like.</small>
<div class="fg"><div class="fc"><h3>Lucky Wheel</h3><small>Red / Black pays $50 · Green pays $500</small><div class="seg" id="sg"><button data-c="r">Red</button><button data-c="k">Black</button><button data-c="z">Green</button></div><div class="orb" id="orb">?</div><div class="fres" id="fr"></div><button class="btn p" id="fs" style="visibility:hidden">Spin</button></div>
<div class="fc"><h3>Lucky Slots</h3><small>Three of a kind $100 · Pair $10</small><div class="fr3" id="r3"><div>🍒</div><div>🍋</div><div>🔔</div></div><div class="fres" id="fr2"></div><button class="btn p" id="fs2">Spin</button></div>
<div class="fc" style="grid-column:1/-1"><h3>Bonus Chips</h3><small>Claim $500 every 5 minutes</small><div class="fres" id="bf"></div><button class="btn p" id="bc">Claim $500</button></div></div></div>`;m.classList.add('on');
const bc=$('#bc'),bf=$('#bf'),CD=300000,fb=$('#free');
const tickc=()=>{if(!m.classList.contains('on'))return clearInterval(fb._t);const left=Math.min(CD,CD-(Date.now()-D.cd));if(left>0){const sc=Math.ceil(left/1000);bc.disabled=true;bc.textContent='Ready in '+(sc/60|0)+':'+String(sc%60).padStart(2,'0')}else{bc.disabled=false;bc.textContent='Claim $500'}};
bc.onclick=()=>{if(Date.now()-D.cd<CD)return;D.cd=Date.now();setBal(D.bal+500);rec('free',0,500,'Bonus Chips');bf.textContent='+'+fmt(500);tickc()};
clearInterval(fb._t);fb._t=setInterval(tickc,500);tickc();
const close=()=>m.classList.remove('on');$('#mx').onclick=close;m.onclick=e=>{if(e.target===m)close()};
let pk=null,bz=false;const RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36],cc=n=>n===0?'z':RED.includes(n)?'r':'k';
$$('#sg button').forEach(b=>b.onclick=()=>{if(bz)return;pk=b.dataset.c;$$('#sg button').forEach(x=>x.classList.toggle('on',x===b));$('#fs').style.visibility='visible'});
$('#fs').onclick=async()=>{if(bz||!pk)return;bz=true;$('#fs').style.visibility='hidden';$('#fr').textContent='';const o=$('#orb'),n=rnd(37);for(let i=0;i<20;i++){const v=i===19?n:rnd(37);o.textContent=v;o.className='orb '+cc(v);await sl((40+i*i*1.5)/D.set.roulette)}
const p=cc(n)===pk?(pk==='z'?500:50):0;if(p){setBal(D.bal+p);rec('free',0,p,`Lucky Wheel ${n}`);$('#fr').textContent='+'+fmt(p)}else{rec('free',0,0,`Lucky Wheel ${n}`);$('#fr').textContent='No luck — spin again'}bz=false;$('#fs').style.visibility='visible'};
$('#fs2').onclick=async()=>{if(bz)return;bz=true;$('#fr2').textContent='';const E=['🍒','🍋','🔔','⭐','7️⃣'],d=[...$$('#r3 div')],f=[rnd(5),rnd(5),rnd(5)];for(let i=0;i<14;i++){d.forEach((x,j)=>{if(i<8+j*3)x.textContent=E[rnd(5)];else x.textContent=E[f[j]]});await sl((50+i*8)/D.set.slot)}
d.forEach((x,j)=>x.textContent=E[f[j]]);const u=new Set(f).size,p=u===1?100:u===2?10:0;if(p){setBal(D.bal+p);$('#fr2').textContent='+'+fmt(p);winFx(p/10,p,$('#r3'))}else $('#fr2').textContent='No luck — spin again';rec('free',0,p,'Lucky Slots '+f.map(i=>E[i]).join(''));bz=false}};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on')});
setBal(D.bal);go((location.hash||'#lobby').slice(1));
</script></body></html>
